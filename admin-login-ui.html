<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Anime World PK</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">ANIME <span>WORLD PK</span></a><nav class="nav"><a href="/">Home</a></nav></header><main><section id="loginBox" class="section"><div class="panel"><h1>Admin Dashboard Login</h1><input id="password" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Login</button><p id="loginMsg" class="muted"></p></div></section><section id="admin" class="section" hidden><div class="row"><h1>Library Dashboard</h1><button class="btn alt" onclick="logout()">Logout</button></div><div id="stats" class="statgrid"></div><form id="animeForm" class="panel" enctype="multipart/form-data"><h2>Add Anime</h2><input name="title" placeholder="Anime title" required><textarea name="description" placeholder="Synopsis / description"></textarea><input name="genres" placeholder="Genres, e.g. Action, Fantasy, Romance"><input name="year" placeholder="Year"><select name="status"><option>Ongoing</option><option>Completed</option><option>Upcoming</option></select><label>Poster image <input name="poster" type="file" accept="image/*"></label><button class="btn">Create Anime</button></form><div id="adminList"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin.js"></script></body></html>
